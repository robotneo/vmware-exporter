version: 2

project_name: vmware-exporter

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: ./
    binary: vmware-exporter
    env:
      - CGO_ENABLED=0
    # Populate github.com/prometheus/common/version so that
    # vmware_exporter_build_info carries real values.
    #
    # Without these, the metric is still exported but with version="" and
    # branch="" -- verified against a plain `go build`. That makes the single
    # most common operational question ("which build is this host running?")
    # unanswerable from monitoring, which is the whole point of build_info.
    #
    # `revision` is the one field Go fills in by itself (from VCS stamping
    # since 1.24), so it looks populated even without ldflags. That is a trap:
    # it makes build_info appear to work when it does not.
    #
    # -s -w strip the symbol table and DWARF data. Prometheus exporters ship
    # this way by default; it cuts the binary roughly in half and the ldflags
    # above are what makes a stack trace's build identifiable anyway.
    ldflags:
      - -s -w
      - -X github.com/prometheus/common/version.Version={{ .Version }}
      - -X github.com/prometheus/common/version.Revision={{ .FullCommit }}
      - -X github.com/prometheus/common/version.Branch={{ .Branch }}
      - -X github.com/prometheus/common/version.BuildDate={{ .Date }}
      - -X github.com/prometheus/common/version.BuildUser=goreleaser
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # `format` and `format_overrides.format` were renamed to `formats` (now a
  # list) in goreleaser v2.6. The singular form still works, but `goreleaser
  # check` exits non-zero on it, and deprecated properties are dropped on major
  # versions -- the release workflow pins `version: latest`, so that removal
  # would land here without warning.
  - formats: [tar.gz]
    # 生成格式如: vmware-exporter-v0.1.16-linux-amd64.tar.gz
    name_template: "{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      # Ship the deployment files with the binary.
      #
      # Both used to live only in the git tree, so the README's "copy
      # vmware-exporter.service to /etc/systemd/system/" instruction had nothing
      # to copy from for anybody who installed from a release tarball -- the
      # documented path required cloning the repository at the right tag.
      #
      # src is needed because the unit sits in a subdirectory: the default would
      # recreate `system/` inside the archive, and the README refers to the file
      # by name.
      - vmware.conf
      - src: system/vmware-exporter.service
        dst: .

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"