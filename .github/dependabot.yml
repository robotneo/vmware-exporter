version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # Only gomod was configured, which is why the workflows had drifted to
  # checkout@v3 and goreleaser-action@v4 -- the latter predating the goreleaser
  # v2 that `version: latest` actually installs. Nothing was watching them.
  #
  # Grouped into one PR: these move together and reviewing six separate
  # version-bump PRs a week is how they end up ignored.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # The Dockerfile builds `FROM golang:alpine`. That is a rolling tag, so it
  # cannot go stale the way a pinned one would -- but it is a third ecosystem in
  # the repository, and leaving it undeclared is the same omission that let the
  # actions drift. scripts/check_config.py now fails if an ecosystem present in
  # the tree has no entry here, so the list cannot fall behind the repository
  # again without CI saying so.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
