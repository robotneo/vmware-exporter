name: Release with goreleaser

on:
  push:
    branches:
      - "!*"
    tags:
      - "v*.*.*"

# on:
  # push:
  #   branches: [ "master" ]
  #   tags:
  #   - 'v[0-9]+.[0-9]+.[0-9]+'
  # release:
  #   types:
  #     - created   # 表示在创建新的 Release 时触发
  #     # - published

permissions:
  contents: write
  # packages: write
  # issues: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          # Read the version from go.mod instead of repeating it here. The
          # pinned '>=1.22.1' had drifted below go.mod's own 1.26.
          go-version-file: go.mod
          cache: true
      # More assembly might be required: Docker logins, GPG, etc. It all depends
      # on your needs.
      #
      # goreleaser-action was pinned at v4, which predates goreleaser v2 --
      # while `version: latest` resolves to v2 and .goreleaser.yaml declares
      # `version: 2`. That combination was a release-time failure waiting for
      # somebody to push a tag. `goreleaser check` now runs on every push (see
      # test.yml) so config problems surface before the tag, not during it.
      - uses: goreleaser/goreleaser-action@v7
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro':
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Your GoReleaser Pro key, if you are using the 'goreleaser-pro'
          # distribution:
          # GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}