name: Docker Image CI

# The docker/* actions below were all one major version behind, and every one of
# those majors carries the same change: node20 -> node24 as the action runtime,
# which GitHub has announced the deprecation of. setup-buildx-action v4 also
# dropped some deprecated inputs, but this workflow passes it none. So these are
# runtime upgrades rather than behaviour changes -- and not optional ones.
#
# They had drifted because no dependency-update automation watched the
# github-actions ecosystem. Dependabot was intentionally removed from this fork,
# so these action versions are now bumped by hand rather than via pull requests.

on:
  push:
    branches: [ "master" ]
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:

  build-latest:

    if: ${{ github.ref == 'refs/heads/master' }}

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker images
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/vmware-exporter:latest
          ghcr.io/${{ github.repository_owner }}/vmware-exporter:latest

  build-version:

    if: ${{ github.ref_type == 'tag' }}
      
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker images
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/vmware-exporter:${{ github.ref_name }}
          ghcr.io/${{ github.repository_owner }}/vmware-exporter:${{ github.ref_name }}
          ${{ secrets.DOCKERHUB_USERNAME }}/vmware-exporter:latest
          ghcr.io/${{ github.repository_owner }}/vmware-exporter:latest          
