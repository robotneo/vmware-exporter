# Configuration for the systemd unit in system/vmware-exporter.service.
#
# Install this at /etc/vmware-exporter/vmware.conf and lock it down -- it holds a
# vCenter password in plain text:
#
#   sudo install -d -m 0755 /etc/vmware-exporter
#   sudo install -m 0600 -o root -g root vmware.conf /etc/vmware-exporter/vmware.conf
#
# 0600 root:root is correct even though the exporter runs as an unprivileged
# DynamicUser: systemd reads EnvironmentFile as root, before dropping
# privileges, and injects the values into the child's environment. The service
# account never needs to open this file itself.
#
# Prefer a read-only vCenter service account over an administrator one. The
# exporter only reads properties and performance counters; it never writes.
#
# ---------------------------------------------------------------------------
# Format: one VARIABLE=value per line. NOT the old ARGS="..." form.
# ---------------------------------------------------------------------------
#
# This used to be a single ARGS="-vmware.password=..." line expanded onto
# ExecStart. That put the password into the process cmdline, where any user on
# the host can read it out of /proc/<pid>/cmdline or plain `ps` -- the exact
# leak that docker-compose.yml had already been fixed for. The unit now runs
# with -envflag.enable and reads these variables instead, so the password stays
# out of the cmdline entirely.
#
# systemd's EnvironmentFile is not a shell: there is no expansion, and quotes are
# stripped, so `pass"word` needs no escaping but a trailing space would be kept.
# Quote the value if it contains spaces or a `#`.
#
# ---------------------------------------------------------------------------
# Variable naming (this trips people up)
# ---------------------------------------------------------------------------
#
# name = the -envflag.prefix value + the flag name with `.` replaced by `_`,
# and THE FLAG NAME KEEPS ITS ORIGINAL CASE. The unit sets the prefix to
# VMWARE_, so:
#
#   -vmware.password      ->  VMWARE_vmware_password
#   -vmware.insecureTLS   ->  VMWARE_vmware_insecureTLS
#   -collector.vsan       ->  VMWARE_collector_vsan
#
# VMWARE_VMWARE_PASSWORD is silently ignored: no warning, no error. The exporter
# uses the flag default and fails to authenticate for a reason nothing in the
# logs explains.

VMWARE_vmware_vcenter=<VCENTER_HOST>:443
VMWARE_vmware_username=<VCENTER_USERNAME>
VMWARE_vmware_password=<VCENTER_PASSWORD>

# vCenter and ESXi both ship self-signed certificates by default. Set this to
# false once you have a trusted certificate chain in place.
VMWARE_vmware_insecureTLS=true

# Optional. Uncomment to override the defaults; every flag is available here
# using the naming rule above. Full reference: README.md / README-zh.md.
#
#VMWARE_http_address=:9169
#VMWARE_log_level=info
#VMWARE_vmware_interval=20
#VMWARE_vmware_granularity=20
#VMWARE_vmware_timeout=60

# vSAN collection is off by default because most estates do not run vSAN.
# -collector.vsan.perf additionally needs the vSAN performance service enabled
# on the cluster; without it vCenter returns empty data rather than an error.
#VMWARE_collector_vsan=true
#VMWARE_collector_vsan_perf=true
