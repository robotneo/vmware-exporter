# Command line flags for the systemd unit in system/vmware-exporter.service.
#
# Place this file at /etc/vmware-exporter/vmware.conf and restrict its
# permissions -- it holds a vCenter password in plain text:
#
#   sudo chown root:root /etc/vmware-exporter/vmware.conf
#   sudo chmod 600 /etc/vmware-exporter/vmware.conf
#
# Prefer a read-only vCenter service account over an administrator one. The
# exporter only reads properties and performance counters; it never writes.
#
# To keep the password out of a file entirely, pass it through the environment
# instead:
#
#   ARGS="-envflag.enable -envflag.prefix=VMWARE_ -vmware.vcenter=<VCENTER_HOST>:443 -vmware.insecureTLS"
#
# and set VMWARE_vmware_password in the unit's EnvironmentFile.
#
# Note the case: the variable name is the prefix followed by the flag name with
# dots replaced by underscores, and the flag name keeps its original lowercase.
# VMWARE_VMWARE_PASSWORD is silently ignored -- the exporter just uses the
# default instead of reporting an error.

ARGS="-vmware.username=<VCENTER_USERNAME> -vmware.password=<VCENTER_PASSWORD> -vmware.vcenter=<VCENTER_HOST>:443 -vmware.insecureTLS"
