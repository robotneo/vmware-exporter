# Credentials come from the environment, not from the command line.
#
# Anything in `command` ends up in the container's cmdline, which is visible to
# `docker inspect`, to `ps` inside the container, and to any process that can
# read /proc. Passing the password via -envflag.enable keeps it out of there.
#
# Create a .env file next to this one (and add it to .gitignore):
#
#   VMWARE_vmware_username=readonly@vsphere.local
#   VMWARE_vmware_password=...
#   VMWARE_vmware_vcenter=vcenter.example.com:443
#
# Mind the case: the variable name is the -envflag.prefix value followed by the
# flag name with dots replaced by underscores, keeping the flag's original
# lowercase. VMWARE_VMWARE_PASSWORD is silently ignored.
#
# Use a read-only vCenter service account. The exporter only reads properties
# and performance counters; it never writes.

services:
  vmware-exporter:
    image: meisite/vmware-exporter:latest
    container_name: vmware-exporter
    hostname: vmware-exporter
    ports:
      - 9169:9169
    environment:
      - VMWARE_vmware_username
      - VMWARE_vmware_password
      - VMWARE_vmware_vcenter
    command:
      - "-envflag.enable"
      - "-envflag.prefix=VMWARE_"
      - "-vmware.granularity=15"
      - "-vmware.interval=15"
    restart: always

# Direct collection from a standalone ESXi host (no vCenter).
